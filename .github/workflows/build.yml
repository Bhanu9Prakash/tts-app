name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  jvm-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs without the Android SDK on purpose: this is the same command that
      # works in a sandbox with no access to Google's Maven, and it proves the
      # security-critical logic is genuinely decoupled from Android.
      - name: Run unit tests
        env:
          # GitHub runners ship an Android SDK, which would pull :app into the
          # build. Blanking these proves the claim this job exists to prove:
          # the security-critical logic compiles and its tests pass with no
          # Android SDK and no access to Google's Maven repository.
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/test"

  android:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew assembleSafeDebug assembleEnhancedDebug --no-daemon --stacktrace

      - name: Assemble release APKs
        run: ./gradlew assembleSafeRelease assembleEnhancedRelease --no-daemon --stacktrace

      # The permission list is a security claim the project makes in its docs,
      # so it is printed on every build rather than asserted once by hand.
      - name: Report APK permissions and checksums
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          {
            echo "# APK report"
            echo
            for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
              echo "## $(basename "$apk")"
              echo
              echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
              echo
              echo "Size: $(du -h "$apk" | cut -f1)"
              echo
              echo "Permissions:"
              echo '```'
              "$AAPT2" dump permissions "$apk" | grep -E "^(uses-permission|permission)" || echo "(none)"
              echo '```'
              echo
            done
          } | tee "$GITHUB_STEP_SUMMARY"

      # Fails the build if the safe flavour ever gains the two permissions the
      # flavour split exists to exclude. This is the mechanism that keeps
      # docs/PERMISSIONS.md true over time.
      - name: Verify safe flavour excludes overlay and accessibility
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          for apk in $(find app/build/outputs/apk/safe -name '*.apk'); do
            echo "Checking $apk"
            if "$AAPT2" dump permissions "$apk" | grep -q "SYSTEM_ALERT_WINDOW"; then
              echo "FAIL: safe flavour requests SYSTEM_ALERT_WINDOW"; exit 1
            fi
            if "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" | grep -q "BIND_ACCESSIBILITY_SERVICE"; then
              echo "FAIL: safe flavour declares an accessibility service"; exit 1
            fi
            echo "OK: $apk"
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: voice-composer-apks
          path: dist/

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    # These are the tests that check what a JVM cannot: the real Android
    # Keystore, the real ClipboardManager, and app-private model storage.
    # Everything else in this repository is honest about never having run on a
    # device; this job is what removes that caveat for the parts it covers.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedSafeDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
